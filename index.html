<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>飛鳥時代カード</title>
<style>
  :root {
    --bg: #fdf8f0;
    --ink: #2b2a33;
    --muted: #7a7684;
    --card: #ffffff;
    --front: #3b5bdb;
    --back: #f08c00;
    --ok: #2f9e44;
    --ng: #e03131;
    --line: #e8e2d6;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  button { -webkit-appearance: none; appearance: none; outline: none; font: inherit; cursor: pointer; border: none; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic", sans-serif;
    padding: max(20px, env(safe-area-inset-top)) 16px max(40px, env(safe-area-inset-bottom));
    min-height: 100vh;
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; text-align: center; }
  .sub { text-align: center; color: var(--muted); margin: 0 0 24px; font-size: .9rem; }
  .screen { display: none; }
  .screen.active { display: block; }

  /* 単元選択 */
  .deck-btn {
    display: flex; justify-content: space-between; align-items: center;
    width: 100%; background: var(--card); border: 2px solid var(--line);
    border-radius: 16px; padding: 16px 18px; margin-bottom: 12px; text-align: left;
    color: var(--ink); transition: transform .1s;
  }
  .deck-btn:active { transform: scale(.98); }
  .deck-btn .name { font-weight: bold; font-size: 1.1rem; }
  .deck-btn .info { color: var(--muted); font-size: .85rem; margin-top: 2px; }
  .deck-btn .badge { font-size: .85rem; font-weight: bold; color: var(--ok); white-space: nowrap; margin-left: 8px; }
  .deck-btn.all { border-color: var(--front); }
  .opts { display: flex; gap: 10px; justify-content: center; margin: 20px 0 8px; flex-wrap: wrap; }
  .toggle {
    background: var(--card); border: 2px solid var(--line); border-radius: 999px;
    padding: 8px 16px; font-size: .9rem; color: var(--ink);
  }
  .toggle.on { background: var(--front); border-color: var(--front); color: #fff; }
  .reset { display: block; margin: 24px auto 0; background: none; color: var(--muted); font-size: .85rem; text-decoration: underline; }

  /* カード */
  .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .back-link { background: none; color: var(--muted); font-size: .95rem; padding: 6px 0; }
  .count { font-weight: bold; color: var(--muted); }
  .bar { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; margin-bottom: 20px; }
  .bar > div { height: 100%; background: var(--front); width: 0; transition: width .3s; }

  .scene { perspective: 1200px; }
  .card {
    position: relative; width: 100%; min-height: 320px;
    transform-style: preserve-3d; transition: transform .5s; cursor: pointer;
  }
  .card.flipped { transform: rotateY(180deg); }
  .face {
    position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
    border-radius: 22px; padding: 28px 24px; display: flex; flex-direction: column;
    justify-content: center; align-items: center; text-align: center;
    box-shadow: 0 6px 20px rgba(0,0,0,.08);
  }
  .face .tag {
    position: absolute; top: 14px; left: 16px; font-size: .75rem; font-weight: bold;
    padding: 4px 10px; border-radius: 99px;
  }
  .front { background: var(--card); border: 3px solid var(--front); }
  .front .tag { background: #e7ecff; color: var(--front); }
  .front .q { font-size: 1.25rem; line-height: 1.7; }
  .front .hint { color: var(--muted); font-size: .85rem; margin-top: 20px; }
  .backface { background: #fff9ef; border: 3px solid var(--back); transform: rotateY(180deg); }
  .backface .tag { background: #fff0d6; color: #c46a00; }
  .backface .a { font-size: 2rem; font-weight: bold; color: #c46a00; line-height: 1.4; }
  .backface .ruby { font-size: .95rem; color: var(--muted); margin-top: 4px; }
  .backface .goro { margin-top: 14px; background: #fff0d6; color: #a85a00; border-radius: 12px; padding: 8px 14px; font-weight: bold; font-size: 1rem; }
  .backface .note { font-size: .95rem; line-height: 1.7; margin-top: 18px; color: var(--ink); text-align: left; }

  .judge { display: flex; gap: 12px; margin-top: 20px; visibility: hidden; }
  .judge.show { visibility: visible; }
  .judge button { flex: 1; padding: 18px 0; border-radius: 16px; font-size: 1.1rem; font-weight: bold; color: #fff; }
  .judge .ng { background: var(--ng); }
  .judge .ok { background: var(--ok); }
  .flip-btn { display: block; width: 100%; margin-top: 20px; padding: 18px 0; border-radius: 16px; background: var(--front); color: #fff; font-size: 1.1rem; font-weight: bold; }
  .flip-btn.hide { display: none; }

  /* 結果 */
  .result-box { background: var(--card); border-radius: 22px; padding: 28px 20px; text-align: center; box-shadow: 0 6px 20px rgba(0,0,0,.06); }
  .score { font-size: 3rem; font-weight: bold; color: var(--front); margin: 8px 0; }
  .msg { font-size: 1.1rem; margin-bottom: 4px; }
  .review { margin-top: 24px; }
  .review h2 { font-size: 1.1rem; margin: 0 0 10px; }
  .review-item { background: var(--card); border-left: 5px solid var(--ng); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; }
  .review-item .rq { font-size: .95rem; line-height: 1.6; }
  .review-item .ra { font-weight: bold; color: #c46a00; margin-top: 4px; }
  .btn-row { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
  .btn { padding: 16px 0; border-radius: 16px; font-size: 1.05rem; font-weight: bold; }
  .btn.primary { background: var(--ng); color: #fff; }
  .btn.secondary { background: var(--front); color: #fff; }
  .btn.plain { background: var(--card); color: var(--ink); border: 2px solid var(--line); }
</style>
</head>
<body>
<div class="wrap">

  <!-- 単元選択 -->
  <section id="home" class="screen active">
    <h1>🏯 飛鳥時代 フラッシュカード</h1>
    <p class="sub">カードをタップして答えを確認しよう</p>
    <div id="decks"></div>
    <div class="opts">
      <button class="toggle on" id="shuffleToggle">🔀 シャッフル</button>
      <button class="toggle" id="reverseToggle">🔁 答え→問題</button>
    </div>
    <button class="reset" id="resetBtn">覚えた記録をリセット</button>
  </section>

  <!-- カード画面 -->
  <section id="study" class="screen">
    <div class="top">
      <button class="back-link" id="quitBtn">← もどる</button>
      <span class="count" id="count"></span>
    </div>
    <div class="bar"><div id="barFill"></div></div>
    <div class="scene">
      <div class="card" id="card">
        <div class="face front">
          <span class="tag" id="frontTag"></span>
          <div class="q" id="frontText"></div>
          <div class="hint">タップでうら返す</div>
        </div>
        <div class="face backface">
          <span class="tag">こたえ</span>
          <div class="a" id="backText"></div>
          <div class="ruby" id="backRuby"></div>
          <div class="goro" id="backGoro"></div>
          <div class="note" id="backNote"></div>
        </div>
      </div>
    </div>
    <button class="flip-btn" id="flipBtn">答えを見る</button>
    <div class="judge" id="judge">
      <button class="ng" id="ngBtn">😣 まだ</button>
      <button class="ok" id="okBtn">😊 覚えた</button>
    </div>
  </section>

  <!-- 結果 -->
  <section id="result" class="screen">
    <div class="result-box">
      <div class="msg" id="resultMsg"></div>
      <div class="score" id="resultScore"></div>
      <div id="resultSub" style="color:var(--muted)"></div>
    </div>
    <div class="review" id="review"></div>
    <div class="btn-row">
      <button class="btn primary" id="retryNgBtn">😣「まだ」のカードだけもう一度</button>
      <button class="btn secondary" id="retryAllBtn">🔀 全部もう一度</button>
      <button class="btn plain" id="homeBtn">単元選択にもどる</button>
    </div>
  </section>

</div>

// ===== 状態 =====
const STORE_KEY = "asuka_flashcards";
let mastered = loadMastered();
let shuffle = true;
let reverse = false;
let currentDeckIds = [];
let queue = [];
let idx = 0;
let ngList = [];
let okCount = 0;

function loadMastered() {
  try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch (e) { return {}; }
}
function saveMastered() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(mastered)); } catch (e) {}
}
function cardKey(deckId, i) { return deckId + ":" + i; }

const $ = id => document.getElementById(id);
function show(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  $(id).classList.add("active");
  window.scrollTo(0, 0);
}

// ===== 単元選択 =====
function renderHome() {
  const box = $("decks");
  box.innerHTML = "";
  const allCount = DECKS.reduce((s, d) => s + d.cards.length, 0);
  const allDone = DECKS.reduce((s, d) => s + d.cards.filter((_, i) => mastered[cardKey(d.id, i)]).length, 0);
  box.appendChild(deckButton("🌟 ぜんぶ", allCount + "枚", allDone, allCount, DECKS.map(d => d.id), true));
  DECKS.forEach(d => {
    const done = d.cards.filter((_, i) => mastered[cardKey(d.id, i)]).length;
    box.appendChild(deckButton(d.name, d.cards.length + "枚", done, d.cards.length, [d.id]));
  });
}
function deckButton(name, info, done, total, ids, isAll) {
  const b = document.createElement("button");
  b.className = "deck-btn" + (isAll ? " all" : "");
  const badge = done === total ? "✅ 全部覚えた" : `覚えた ${done}/${total}`;
  b.innerHTML = `<div><div class="name">${name}</div><div class="info">${info}</div></div><div class="badge">${badge}</div>`;
  b.onclick = () => start(ids);
  return b;
}

// ===== 学習 =====
function start(deckIds, onlyCards) {
  currentDeckIds = deckIds;
  queue = onlyCards || deckIds.flatMap(id => {
    const d = DECKS.find(x => x.id === id);
    return d.cards.map((c, i) => ({ ...c, key: cardKey(id, i), deck: d.name }));
  });
  if (shuffle) queue = shuffled(queue);
  idx = 0; ngList = []; okCount = 0;
  show("study");
  renderCard();
}
function shuffled(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function renderCard() {
  const c = queue[idx];
  const card = $("card");
  card.classList.remove("flipped");
  $("judge").classList.remove("show");
  $("flipBtn").classList.remove("hide");
  $("count").textContent = `${idx + 1} / ${queue.length}`;
  $("barFill").style.width = (idx / queue.length * 100) + "%";
  $("frontTag").textContent = c.deck;

  const useReverse = reverse && !c.long;
  // うら返しアニメ中に中身が見えないよう少し待って差しかえ
  setTimeout(() => {
    $("frontText").innerHTML = esc(useReverse ? c.a : c.q).replace(/\n/g, "<br>");
    $("frontText").style.fontSize = useReverse ? "2rem" : "";
    $("frontText").style.fontWeight = useReverse ? "bold" : "";
    $("backText").innerHTML = esc(useReverse ? c.q : c.a).replace(/\n/g, "<br>");
    $("backText").style.fontSize = (useReverse || c.long) ? "1.15rem" : "";
    $("backRuby").textContent = useReverse ? "" : (c.r || "");
    $("backNote").textContent = c.n ? "📖 " + c.n : "";
    $("backGoro").textContent = c.g ? "🎵 語呂：" + c.g : "";
    $("backGoro").style.display = c.g ? "" : "none";
    if (useReverse) $("backNote").textContent = "（" + c.a + (c.r ? "：" + c.r : "") + "）  📖 " + c.n;
  }, card.classList.contains("flipped") ? 250 : 0);
}
function esc(s) {
  return s.replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));
}
function flip() {
  const card = $("card");
  card.classList.toggle("flipped");
  if (card.classList.contains("flipped")) {
    $("judge").classList.add("show");
    $("flipBtn").classList.add("hide");
  }
}
function judge(ok) {
  const c = queue[idx];
  if (ok) { okCount++; mastered[c.key] = true; }
  else { ngList.push(c); delete mastered[c.key]; }
  saveMastered();
  idx++;
  if (idx >= queue.length) showResult();
  else {
    $("card").classList.remove("flipped");
    setTimeout(renderCard, 250);
  }
}

// ===== 結果 =====
function showResult() {
  const total = queue.length;
  const rate = Math.round(okCount / total * 100);
  $("resultScore").textContent = `${okCount} / ${total}`;
  $("resultSub").textContent = `覚えた率 ${rate}%`;
  $("resultMsg").textContent =
    rate === 100 ? "🎉 パーフェクト！すごい！" :
    rate >= 80 ? "👏 よくできました！あと少し！" :
    rate >= 50 ? "💪 いい調子！「まだ」をもう一度やろう" :
    "📚 くり返して覚えよう！";
  const rv = $("review");
  if (ngList.length) {
    rv.innerHTML = "<h2>😣 まだのカード</h2>" + ngList.map(c =>
      `<div class="review-item"><div class="rq">${esc(c.q).replace(/\n/g, "<br>")}</div><div class="ra">→ ${esc(c.a)}</div>${c.g ? `<div style="color:#a85a00;font-size:.9rem;margin-top:2px">🎵 ${esc(c.g)}</div>` : ""}</div>`
    ).join("");
  } else rv.innerHTML = "";
  $("retryNgBtn").style.display = ngList.length ? "" : "none";
  show("result");
}

// ===== イベント =====
$("card").onclick = flip;
$("flipBtn").onclick = flip;
$("okBtn").onclick = () => judge(true);
$("ngBtn").onclick = () => judge(false);
$("quitBtn").onclick = () => { renderHome(); show("home"); };
$("homeBtn").onclick = () => { renderHome(); show("home"); };
$("retryAllBtn").onclick = () => start(currentDeckIds);
$("retryNgBtn").onclick = () => start(currentDeckIds, ngList.slice());
$("shuffleToggle").onclick = e => { shuffle = !shuffle; e.currentTarget.classList.toggle("on", shuffle); };
$("reverseToggle").onclick = e => { reverse = !reverse; e.currentTarget.classList.toggle("on", reverse); };
$("resetBtn").onclick = () => {
  if (confirm("覚えた記録をリセットしますか？")) { mastered = {}; saveMastered(); renderHome(); }
};

renderHome();
</script>
</body>
</html>
